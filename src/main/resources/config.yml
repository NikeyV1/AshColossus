# ============================================================================
#  Ash Colossus · Wither Boss                      by NikeyV1 (Buffed SMP)
#  Free boss plugin. Resource pack included, nothing else to install.
#
#  Everything below can also be changed in-game:
#    /witherboss config set <path> <value>     /witherboss difficulty <preset>
#    /witherboss loot                          (loot editor, saved in loot.yml)
#  Run /witherboss reload after editing this file by hand.
# ============================================================================

config-version: 1

general:
  enabled: true
  # Name of the arena. The plugin builds it automatically in its own world (wither_boss_<name>).
  arena: forge

# --- How the event starts and who may take part -----------------------------
event:
  # SIGIL         Build a Wither while holding a Colossus Sigil in your other hand. Normal Withers stay vanilla.
  # WITHER_BUILD  Every Wither build awakens the Colossus (original Buffed SMP behaviour).
  # COMMAND       Only /witherboss summon (staff, or players with witherboss.summon).
  trigger: SIGIL
  # Players that must be online for a summoning.
  min-online: 2
  # Confirmed fighters needed when the preparation ends. Boss HP scales with the fighters.
  min-participants: 2
  # Seconds the players have to agree after a summoning.
  lobby-seconds: 45
  # Players within this many blocks of the summoning are pulled into the arena.
  join-radius: 50
  # Pulled-in players count as agreed (they can still /witherboss leave).
  auto-confirm-nearby: true
  announce-summon: true
  announce-first-victory: true
  # Minutes before the boss can be summoned again after a fight ended. 0 = no cooldown.
  cooldown-minutes: 30
  # true = the boss is a one-time server event. After the first victory Withers are vanilla again.
  one-time-only: false
  # Give the summoning materials back if the fight never starts or ends by a technical error.
  refund-on-failed-start: true
  # Worlds where summoning is allowed. Empty = every world.
  allowed-worlds: []
  # Only for trigger WITHER_BUILD: let a vanilla Wither spawn while the boss is unavailable (cooldown, time window, too few players).
  allow-vanilla-when-unavailable: false
  # The fight is stopped safely when the server TPS stays below this value.
  minimum-tps: 12.0
  # Optional daily window for summoning, in the given time zone (for example Europe/Berlin, America/New_York).
  time-window:
    enabled: false
    timezone: UTC
    from: "16:00"
    to: "23:00"

# --- Difficulty ---------------------------------------------------------------
# One switch for the overall feel. All other values below are multiplied with the preset.
#   EASY       -20% boss HP, -30% damage, +2 revives, slower enrage, weaker minions
#   NORMAL     recommended defaults, tuned for groups in diamond/netherite gear
#   HARD       +25% HP, +30% damage, -1 revive
#   NIGHTMARE  +50% HP, +75% damage, -2 revives, fast enrage
difficulty:
  preset: NORMAL

health:
  # Boss HP per fighter: 5 fighters = 10 000 HP. Fighters who join later raise the maximum, progress is kept.
  per-player: 2000.0
  # The boss never has less HP than for this many fighters.
  min-scaling-players: 2
  # Extra multiplier on top of the preset.
  multiplier: 1.0

# --- Damage the boss deals ------------------------------------------------------
# Raw damage before armor, enchantments and absorption.
# Final damage = attack value x global-multiplier x phase multiplier x enrage x preset.
damage:
  global-multiplier: 1.0
  phase-multipliers:
    # Phase I (100% to 66% HP)
    glut: 0.9
    # Phase II, the hammer phase (66% to 33% HP)
    hammer: 0.7
    # Phase III, the core meltdown (33% to 0% HP)
    core: 0.6
  attacks:
    sweep: 38.1
    slam: 39.7
    wave: 29.8
    beam: 43.1
    skull: 29.8
    chain: 43.1
    hammer: 46.4
    fissure: 26.5
    spin: 38.1
    nova: 44.7
    ember: 29.8
    comet: 48.0
    pulse: 19.9
    brand: 31.5
    storm: 24.8
    maw: 48.0
    boundary: 33.1
    minion: 16.6
    debris: 39.7
    grid: 41.4
    spike: 34.8
    blade: 38.1
    miasma: 10.8
    retribution: 39.7
    beacon: 30.0
    beaconblast: 44.7

# --- The boss gets angrier the longer the fight lasts -----------------------------
enrage:
  # One enrage stage every this many seconds.
  stage-seconds: 75
  # Each stage adds this share of damage (0.02 = +2%).
  damage-per-stage: 0.02
  max-stages: 5

fight:
  # Hard time limit. When it runs out the group is defeated.
  time-limit-minutes: 25
  # In phase III the arena rim melts away and a final meltdown ends the fight when the boss lives too long.
  meltdown:
    enabled: true
    after-seconds: 420
  revive:
    # Shared revive charges per fight (preset adds or removes some).
    charges: 5
    # Seconds a fighter has to stand still at the soul lantern of a fallen player.
    channel-seconds: 5
  # Pause between attacks. 1.0 = default pace, 1.3 = 30% longer pauses, 0.8 = faster.
  pause-multiplier: 1.1
  # Attacks that never appear. Keys: sweep slam beam skulls chain spikes debris blade minions hammer spin nova rain comet brand grid miasma beacons storm maw
  disabled-attacks: []

# --- Damage the players deal ---------------------------------------------------------
# Multipliers on your normal weapon damage. The armored body takes less, the golden heart more.
player-damage:
  body-multiplier: 0.5
  core-phase-body-multiplier: 0.8
  heart-multiplier: 1.5

# When 'attackers' players deal 'burst-percent' % of the boss HP within 2.5 seconds, the boss
# answers with a red ring around itself. Punishes everyone clumping on the boss.
retribution:
  enabled: true
  burst-percent: 0.5
  attackers: 3

# --- Mini bosses and helpers --------------------------------------------------------
# Ash Sentinels (wither skeletons), the Ashbreaker (brute) and the Consuming Beacons.
minions:
  health-multiplier: 0.9
  damage-multiplier: 0.8
  # Scales how many sentinels each summon creates.
  count-multiplier: 0.85
  max-alive: 14
  warrior-health: 44
  brute-health: 190
  beacon-health-multiplier: 0.85

# --- What happens to the players' items --------------------------------------------
death:
  # Hardcore options. Default: nobody ever loses items in this fight.
  lose-inventory-on-defeat: false
  lose-inventory-on-logout: false

# --- Rewards ----------------------------------------------------------------------------
# The loot table itself lives in loot.yml and is edited in-game with /witherboss loot.
loot:
  # A fighter shares in the loot with at least this much damage dealt (or any revive / helper kill).
  min-damage: 20

# --- Colossus Sigil (trigger SIGIL) -----------------------------------------------------
sigil:
  recipe:
    enabled: true
    shape:
      - "WSW"
      - "SNS"
      - "WSW"
    ingredients:
      W: WITHER_SKELETON_SKULL
      S: SOUL_SAND
      N: NETHER_STAR

# --- Resource pack ---------------------------------------------------------------------------
# The pack (boss model, animations, sounds, music) ships inside the plugin jar.
resource-pack:
  # false = you deliver the pack yourself (merge it into your own server pack).
  enabled: true
  # default = download from the project repository (works out of the box). Or your own https link to the zip.
  url: default
  # auto = checksum of the pack inside this jar.
  sha1: auto
  # No file host? The plugin can serve the pack itself. Open the TCP port, then set your server address.
  self-host:
    enabled: false
    bind-address: 0.0.0.0
    port: 25663
    public-address: ""

# --- Discord announcements ---------------------------------------------------------------
discord:
  enabled: false
  # Server settings > Integrations > Webhooks > Copy webhook URL
  webhook-url: ""
  username: "Ash Colossus"
  avatar-url: ""
  events:
    boss-summoned: true
    boss-defeated: true

# --- Credits ---------------------------------------------------------------------------------
# One line of credit for fighters at the start and the end of a fight. /witherboss about always works.
credits:
  enabled: true
  link: "https://github.com/NikeyV1/Wither-Boss"

# --- Testing ---------------------------------------------------------------------------------
# Staff can always run /witherboss test. true lets every player run solo test fights.
test:
  enabled: false
  health-factor: 1.0
